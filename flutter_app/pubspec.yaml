name: streetbite
description: StreetBite V1.0, a bilingual street food discovery and ordering app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  dio: ^5.8.0
  shared_preferences: ^2.5.0
  google_maps_flutter: ^2.12.0
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
